# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bofa_scraper"
version = "1.0.4"
description = "Simple Python web-scraper to get personal transaction data from BofA account."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Wllew4", email = "willjanelle2@gmail.com" },
    { name = "Scanner", email = "scanner@apricot.com" },
]
license = { text = "GNU General Public License v3 (GPLv3) (GPL3)" }
dependencies = [
    "selenium",
]

[project.urls]
Homepage = "https://github.com/Wllew4/bofa_scraper"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without explicit strict parameter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
exclude = [
    '__pycache__',
    '^\\.mnt',
    '.*[-_]cache',
    '.git',
    '\\.venv',
    'venv*',
    'tmp',
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
