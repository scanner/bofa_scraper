---
kind: pipeline
name: bofa_scraper Tests

# Temp volume is an ephemeral per-run shared mount.  The lint step populates
# the venv; the test step reuses it without re-running `uv sync`.
#
volumes:
  - name: python-venv
    temp: {}

steps:
  - name: lint
    # NOTE: Keep this version in sync with .python-version
    image: "python:3.13.16"
    volumes:
      - name: python-venv
        path: /drone/src/.venv
    environment:
      PYTHONUNBUFFERED: 1
      UV_LINK_MODE: copy
    commands:
      # Dev dependencies are a `[dependency-groups]` group, which `uv sync`
      # installs by default -- no `--extra` needed.
      #
      - pip install uv
      - uv sync --frozen
      - uv run ruff check bofa_scraper tools tests
      - uv run ruff format --check bofa_scraper tools tests
      - uv run mypy --install-types --non-interactive --explicit-package-bases ./bofa_scraper/ ./tools/ ./tests/

  - name: test
    image: "python:3.13.16"
    depends_on:
      - lint
    volumes:
      - name: python-venv
        path: /drone/src/.venv
    environment:
      PYTHONUNBUFFERED: 1
      UV_LINK_MODE: copy
    commands:
      # The tests use synthetic inputs and mock drivers; nothing starts a
      # browser or contacts Bank of America.
      #
      - pip install uv
      - uv run pytest -v

---
kind: pipeline
name: Build Notify

depends_on:
  - bofa_scraper Tests

trigger:
  # Belt and braces: pull request builds are also switched off in Drone's
  # own settings.  This keeps PRs green if that switch is ever back on.
  #
  event:
    exclude:
      - pull_request
  status:
    - success
    - failure

steps:
  - name: slack notification
    image: plugins/slack
    settings:
      webhook:
        from_secret: slack_notify_webhook
      channel: builds
      username: drone
      template: >-
        {{#if build.pull }}
          *{{#success build.status }}✔{{ else }}✘{{/success }} {{ uppercasefirst build.status }}*: <https://github.com/{{ repo.owner }}/{{ repo.name }}/pull/{{ build.pull }}|Pull Request {{ build.pull }}>
        {{ else }}
          *{{#success build.status }}✔{{ else }}✘{{/success }} {{ uppercasefirst build.status }}: Build {{ build.number }}* (type: `{{ build.event }}`)
        {{/if }}

        Repository: <https://github.com/{{ repo.owner }}/{{ repo.name }}|{{ repo.name }}>

        Commit message: {{ build.message }}

        Commit: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

        Branch: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{ build.branch }}>

        Author: {{ build.author }}

        Duration: {{ since build.started }}

        <{{ build.link }}|Visit build page ↗>
